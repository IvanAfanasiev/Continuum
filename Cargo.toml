[package]
name = "continuum"
version = "0.1.0"
edition = "2021"

[dependencies]
# Audio output
cpal = "0.15"

# Lock-free queue between composer and audio engine
crossbeam-queue = "0.3"

# Random number generation for Markov chain sampling
rand = "0.9"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

[package]
name = "continuum"
version = "0.1.0"
edition = "2021"

[dependencies]
# Audio output
cpal = "0.15"

# Lock-free queue between composer and audio engine
crossbeam-queue = "0.3"

# JSON serialization for LLM responses
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Candle — local inference in pure Rust, no cmake required
candle-core = { version = "0.8", default-features = false }
candle-nn = { version = "0.8", default-features = false }
candle-transformers = { version = "0.8", default-features = false }

# HuggingFace tokenizer
tokenizers = { version = "0.19", default-features = false, features = ["onig"] }

# Model download / cache (desktop); bundled path used on Android
# "online" enables network + TLS; "tokio" for the async downloader
hf-hub = { version = "0.5", features = ["default-tls", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[profile.release]
opt-level = 3
lto = true         # Link-Time Optimization — smaller and faster binary
codegen-units = 1  # Slower compile, faster runtime
strip = true       # Strip debug symbols to reduce binary size

[profile.dev]
opt-level = 1      # Candle is very slow without at least basic optimization
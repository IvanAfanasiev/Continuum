[package]
name = "rust_lib_cont"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
cpal = "0.15"
rand = "0.8"
crossbeam = "0.8"

# Только Android: JavaVM для ndk-context (cpal/Oboe без него падают),
# JNI-мост в AudioTrack для нативного аудио-потока (без участия Dart).
[target.'cfg(target_os = "android")'.dependencies]
ndk-context = "0.1"
jni = "0.22"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

# Debug на устройстве обязан играть без затыков: чистый opt-level=0
# даёт ~в 5–7 раз медленнее release (замер soak), и мобильному ядру
# этого не хватает в плотных местах (дроп). Как в v1: dev = opt-level 2
# (компиляция чуть дольше, звук как в релизе).
[profile.dev]
opt-level = 2

[features]
jni = []
